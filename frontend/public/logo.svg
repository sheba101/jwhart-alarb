<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      
      .ar-text {
        font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        font-size: 58px;
        font-weight: 800;
        fill: #003366;
        text-anchor: middle;
      }
      .en-text {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: 5px;
        fill: #C67D5A;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g id="logo-icon">
