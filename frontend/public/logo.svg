    <!-- الجناح الأيسر -->
    <polygon points="204,153 177,175 201,185 221,184" fill="#003366" />
    <polygon points="176,182 201,189 238,280" fill="#003366" />

    <!-- الجناح الأيمن -->
    <polygon points="296,153 323,175 299,185 279,184" fill="#003366" />
    <polygon points="324,182 299,189 262,280" fill="#003366" />

